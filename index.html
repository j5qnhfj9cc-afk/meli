<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mis horarios</title>

  <style>
    :root{
      /* MODO CLARO: ROSA */
      --bg:#fff1f8;
      --text:#5a2943;
      --muted:#946b83;
      --card:#ffdfee;
      --border:#f2bcd4;
      --thead:#ffcfe4;
      --code:#ffe7f2;

      --free-bg:#ffd8ea;
      --free-border:#f0a9ca;

      --class-bg:#ffbfdc;
      --class-border:#e88ab6;
    }

    html[data-theme="dark"]{
      /* MODO OSCURO: MORADO */
      --bg:#140f1d;
      --text:#f3eaff;
      --muted:#bca9d6;
      --card:#21172f;
      --border:#4a3566;
      --thead:#2a1d3d;
      --code:#312247;

      --free-bg:#312347;
      --free-border:#7d5aac;

      --class-bg:#442b63;
      --class-border:#a67ce0;
    }

    body{
      background:var(--bg);
      color:var(--text);
      font-family:system-ui, -apple-system, Segoe UI, Roboto, Arial;
      margin:24px;
      line-height:1.35;
    }

    .card{
      max-width:920px;
      margin:auto;
      padding:18px;
      border:1px solid var(--border);
      background:var(--card);
      border-radius:14px;
    }

    .status{
      font-size:22px;
      font-weight:800;
      padding:12px 14px;
      border-radius:12px;
      margin:12px 0 10px;
      transition:background .2s ease, border-color .2s ease, color .2s ease;
    }

    .free{
      background:var(--free-bg);
      border:1px solid var(--free-border);
    }

    .class{
      background:var(--class-bg);
      border:1px solid var(--class-border);
    }

    .small{
      color:var(--muted);
      font-size:13px;
    }

    code{
      background:var(--code);
      padding:2px 6px;
      border-radius:8px;
    }

    table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
}

th,td{
  border-bottom:1px solid var(--border);
  padding:10px 12px;
  text-align:left;
  vertical-align:top;
}

#table th:nth-child(1),
#table td:nth-child(1){
  width:22%;
}

#table th:nth-child(2),
#table td:nth-child(2){
  width:28%;
}

#table th:nth-child(3),
#table td:nth-child(3){
  width:50%;
}

    th{
  background:var(--thead);
  font-weight:700;
  letter-spacing:.2px;
}

    button{
      border:1px solid var(--border);
      background:transparent;
      color:var(--text);
      padding:8px 10px;
      border-radius:10px;
      cursor:pointer;
    }

    button:hover{
      opacity:.9;
    }

    .grid{
      display:grid;
      gap:14px;
      grid-template-columns:1fr;
    }

    @media (min-width: 860px){
      .grid{
        grid-template-columns:1fr 1fr;
      }
    }

    .panel{
      border:1px solid var(--border);
      border-radius:14px;
      padding:12px;
      background:rgba(255,255,255,0.08);
    }

    .cal-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      margin-bottom:10px;
    }

    .cal-title{
      font-weight:800;
    }

    .cal{
      width:100%;
      border-collapse:collapse;
    }

    .cal th,.cal td{
      border:1px solid var(--border);
      padding:8px;
      vertical-align:top;
    }

    .cal th{
      background:var(--thead);
      font-size:12px;
      color:var(--muted);
    }

    .daynum{
      font-weight:700;
      font-size:12px;
      opacity:.85;
    }

    .chip{
  display:block;
  margin-top:6px;
  padding:6px 8px;
  border-radius:10px;
  border:1px solid var(--border);
  background:rgba(255,255,255,0.12);
  font-size:12px;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
  </style>
</head>

<body>
  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:12px;">
      <h1 style="margin:0">📚 Meli horarios</h1>
      <button id="themeBtn" type="button">🌙 Oscuro</button>
    </div>

    <div id="status" class="status free">Cargando…</div>

    <div class="small" style="margin-bottom:10px;">
      Zona horaria: <code>America/Chile/Santiago</code>
    </div>

    <details id="scheduleDetails" open class="panel">
      <summary style="cursor:pointer; font-weight:800; margin:6px 0;">1) Horario semanal</summary>

      <table id="table">
        <thead>
          <tr><th>Día</th><th>Bloque</th><th>Materia</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </details>

    <div class="grid" style="margin-top:14px;">
      <div class="panel">
        <div style="font-weight:800; margin-bottom:8px;">2) Próximo parcial</div>
        <div id="nextExam" style="font-size:18px; font-weight:800;">Cargando…</div>
        <div id="nextExamMeta" class="small"></div>
      </div>

      <div class="panel">
        <div style="font-weight:800; margin-bottom:8px;">3) Calendario mensual</div>

        <div class="cal-head">
          <button id="prevMonth" type="button">◀</button>
          <div id="calMonthTitle" class="cal-title">—</div>
          <button id="nextMonth" type="button">▶</button>
        </div>

        <table class="cal" id="calendar">
          <thead>
            <tr>
              <th>Dom</th><th>Lun</th><th>Mar</th><th>Mié</th><th>Jue</th><th>Vie</th><th>Sáb</th>
            </tr>
          </thead>
          <tbody id="calendarBody"></tbody>
        </table>

        <div class="small" style="margin-top:8px;">
          Los parciales aparecen marcados. Puedes moverte entre meses con ◀ ▶.
        </div>
      </div>
    </div>
  </div>

  <script src="schedule.js"></script>
</body>
</html>
